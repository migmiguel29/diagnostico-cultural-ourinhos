name: Validar sintaxe
on:
  push:
  pull_request:
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe Python
        run: python -m compileall -q app.py pages scripts tests
      - name: Testar coordenadas do dashboard
        run: |
          python -m pip install 'pandas>=2.1,<3'
          python tests/test_map_data.py
