name: Validar sintaxe
on:
  push:
  pull_request:
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe Python
        run: python -m compileall -q app.py pages scripts
